<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt</title>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/intro.css">
    <link rel="stylesheet" href="src/css/menu.css">
    <link rel="stylesheet" href="src/css/game.css">
    <link rel="stylesheet" href="src/css/rankings.css">
</head>
<body>
    <!-- AUDIO - Se reproducirá automáticamente, desmutado por JavaScript -->
    <audio id="bgAudio" autoplay loop playsinline>
        <source src="assets/audio/soundtrack.mp3" type="audio/mpeg">
    </audio>

    <!-- INTRO SCREEN -->
    <div id="introScreen" class="intro-container">
        <img src="assets/images/intro.png" alt="Intro" class="intro-image">
    </div>

    <!-- MODAL PARA NOMBRE DEL JUGADOR -->
    <div id="playerNameModal" class="player-name-modal hidden">
        <div class="player-name-content">
            <h1 class="player-name-title">ENTER YOUR NAME</h1>
            <input type="text" id="playerNameInput" class="player-name-input" placeholder="Enter name..." maxlength="20">
            <div class="player-name-buttons">
                <button id="confirmNameBtn" class="menu-button play-button">START</button>
                <button id="cancelNameBtn" class="menu-button back-button">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div id="mainMenu" class="menu-container hidden">
        <div class="menu-content">
            <img id="menuDogImage" src="assets/images/dog-duck1.png" alt="Dog" class="menu-dog-image" />
            <h1 class="menu-title">DUCK HUNT</h1>
            <div class="menu-buttons">
                <button id="playBtn" class="menu-button play-button">PLAY</button>
                <button id="rankingsBtn" class="menu-button rankings-button">RANKINGS</button>
            </div>
        </div>
        <button id="exitBtn" class="menu-button exit-button">EXIT</button>
    </div>

    <!-- RANKINGS -->
    <div id="rankingsMenu" class="rankings-container hidden">
        <div class="rankings-content">
            <h1 class="rankings-title">RANKINGS</h1>
            <div class="rankings-list">
                <table class="rankings-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Player</th>
                            <th>Score</th>
                            <th>Map</th>
                            <th>Round</th>
                        </tr>
                    </thead>
                    <tbody id="rankingsTableBody">
                    </tbody>
                </table>
            </div>
            <div class="rankings-buttons">
                <button id="clearRankingsBtn" class="menu-button exit-button">DELETE RANKINGS</button>
            </div>
        </div>
        <button id="backFromRankingsBtn" class="menu-button back-button back-button-rankings">BACK</button>
    </div>

    <!-- JUEGO -->
    <div id="gameScene" class="game-scene hidden">
        <div class="game-hud">
            <div class="hud-item">
                <span class="hud-label">SCORE:</span>
                <span id="totalScore" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">ROUND:</span>
                <span id="roundNumber" class="hud-value">1</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SHOTS:</span>
                <div id="ammoCount" class="ammo-display">
                    <span class="ammo-dot red"></span>
                    <span class="ammo-dot red"></span>
                    <span class="ammo-dot red"></span>
                </div>
            </div>
            <div class="hud-item">
                <span class="hud-label">DUCKS:</span>
                <span id="ducksRemaining" class="hud-value"><span id="ducksCaught">0</span>/6</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">MAP:</span>
                <span id="mapName" class="hud-value">---</span>
            </div>
        </div>
        <div id="gameContainer" class="game-container"></div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOverScreen" class="game-over-screen hidden">
        <div class="game-over-content">
            <h1 class="game-over-title">GAME OVER</h1>
            <div class="game-over-stats">
                <div class="stat-row">
                    <span class="stat-label">Score:</span>
                    <span id="finalScore" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Round:</span>
                    <span id="finalRound" class="stat-value">1</span>
                </div>
            </div>
            <button id="backToMenuBtn" class="menu-button back-button">MAIN MENU</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="src/js/config.js"></script>
    <script src="src/js/storage.js"></script>
    <script src="src/js/menu.js"></script>
    <script src="src/js/game.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
